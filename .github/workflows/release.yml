name: Release

on:
  push:
    tags:
      - 'v*'

# Third-party code is pinned by digest rather than by tag, so a retagged
# release cannot silently change what runs here. Trailing comments record the
# human-readable version each digest corresponds to.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub release for this repo. Pushing the cask to
      # homebrew-tap is a cross-repo write, so it uses HOMEBREW_TAP_TOKEN.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history for the changelog

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          # Publishes the release in this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commits the generated cask to frodi-karlsson/homebrew-tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
