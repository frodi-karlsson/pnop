version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: pni
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    main: .
    binary: pni
    ldflags:
      - -s -w -X github.com/frodi-karlsson/pni/internal/version.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{.ProjectName}}_{{.Os}}_{{.Arch}}"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  draft: true
  prerelease: auto

brews:
  - name: pni
    repository:
      owner: frodi-karlsson
      name: homebrew-tap
    commit_author:
      name: goreleaserbot
      email: goreleaser@carlosbecker.com
    homepage: "https://github.com/frodi-karlsson/pni"
    description: "pnpm install with automatic npm token recovery from 1Password"
    license: "MIT"
